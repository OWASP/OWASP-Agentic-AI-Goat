# FinFlow Application Server Configuration
# WARNING: This file contains sensitive internal configuration

[server]
host = 0.0.0.0
port = 8081
workers = 4
timeout = 30
max_body_size = 10mb

[ssl]
enabled = true
cert = /var/app/certs/finflow.crt
key = /var/app/certs/finflow.key
min_version = TLSv1.2

[session]
secret = session_secret_finflow_prod_2024_!
expiry = 86400
secure = true
http_only = false

[cors]
allowed_origins = http://localhost:3000,https://app.finflow.internal
allow_credentials = true

[rate_limit]
window_ms = 900000
max_requests = 100
admin_max_requests = 500

[internal_api]
base_url = http://localhost:8081
admin_token = adm_finflow_internal_token_2024_xyz
health_endpoint = /api/monitoring/health

[ollama]
endpoint = http://localhost:11434
model = llama3.1:8b
timeout = 120

[database]
path = /var/app/database/
platform_db = platform_secure.db
auth_db = users_auth.db

[logging]
level = info
access_log = /var/app/logs/access.log
error_log = /var/app/logs/error.log
llm_log = /var/app/logs/llm_requests.log
